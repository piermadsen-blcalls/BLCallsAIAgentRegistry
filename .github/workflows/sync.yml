name: Sync Canoe Calls

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:
    inputs:
      sync_from:
        description: 'Start of window (ISO, e.g. 2026-06-01T00:00:00.000Z). Leave blank for yesterday.'
        default: ''
      sync_to:
        description: 'End of window (ISO). Leave blank for today midnight.'
        default: ''
      patch_max:
        description: 'Max transcription patches per run (raise for backfill, e.g. 200000).'
        default: ''
      skip_pass1:
        description: 'Set to any value to skip Pass 1 (calls) and only patch transcriptions.'
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run sync
        env:
          CANOE_API_URL:         ${{ secrets.CANOE_API_URL }}
          CANOE_API_KEY:         ${{ secrets.CANOE_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_FROM:             ${{ github.event.inputs.sync_from }}
          SYNC_TO:               ${{ github.event.inputs.sync_to }}
          PATCH_MAX:             ${{ github.event.inputs.patch_max }}
          SKIP_PASS1:            ${{ github.event.inputs.skip_pass1 }}
        run: node scripts/sync.js
