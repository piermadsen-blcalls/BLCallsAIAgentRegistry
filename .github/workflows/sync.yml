name: Sync Canoe Calls

on:
  schedule:
    # Daily, off the top of the hour (GitHub delays top-of-hour schedules most; this has
    # started 2.5-5h late). Lateness or a dropped run is safe: the next run catches up from
    # the last full sync (sync_state), and the rollups refresh when it lands.
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      sync_from:
        description: 'Start of window (ISO, e.g. 2026-06-01T00:00:00.000Z). Leave blank for the default (last 2 days, or back to the last full sync).'
        default: ''
      sync_to:
        description: 'End of window (ISO). Leave blank for today midnight.'
        default: ''
      patch_max:
        description: 'Max transcription patches per run (raise for backfill, e.g. 200000).'
        default: ''
      skip_pass1:
        description: 'Set to any value to skip Pass 1 (calls) and only patch transcriptions.'
        default: ''

# One sync at a time: two overlapping runs would race on the high-water mark.
concurrency:
  group: sync-canoe-calls
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run sync
        env:
          CANOE_API_URL:         ${{ secrets.CANOE_API_URL }}
          CANOE_API_KEY:         ${{ secrets.CANOE_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_FROM:             ${{ github.event.inputs.sync_from }}
          SYNC_TO:               ${{ github.event.inputs.sync_to }}
          PATCH_MAX:             ${{ github.event.inputs.patch_max }}
          SKIP_PASS1:            ${{ github.event.inputs.skip_pass1 }}
        run: node scripts/sync.js

      # One email per AI IVR the sync's check registered for setup (or the 07:15 UTC pg_cron check
      # found since the last run). Also after a failed pass: the check runs regardless.
      - name: Email new IVRs
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          ASCND_ALERT_WEBHOOK_URL: ${{ secrets.ASCND_ALERT_WEBHOOK_URL }}
          DASHBOARD_URL:           ${{ vars.DASHBOARD_URL }}
          ALERT_MODE:              new_ivrs
        run: node scripts/alert.js
