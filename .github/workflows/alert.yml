name: Send Compliance Alerts

on:
  schedule:
    - cron: '0 16 * * 1,4'  # Mon + Thu at 4pm UTC (~10am MT)
  workflow_dispatch:
    inputs:
      manager_id:
        description: 'Limit to one manager UUID (leave blank for all)'
        default: ''
      manager_name:
        description: 'Limit to one manager by name, e.g. "Matt Fu" (leave blank for all)'
        default: ''
      override_email:
        description: 'Send ALL output to this address instead of the managers (preview/testing)'
        default: ''
      all_managers:
        description: 'Preview: include ALL managers with accounts, ignoring the enabled flag (requires override_email)'
        default: 'false'
      window_days:
        description: 'Force the window to the last N days (blank = since last digest)'
        default: ''
      window_from:
        description: 'Explicit window start (ISO/date), overrides window_days (testing)'
        default: ''
      window_to:
        description: 'Explicit window end (ISO/date) (testing)'
        default: ''
      dry_run:
        description: 'true to log without sending webhook'
        default: 'false'

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Send alerts
        env:
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          ASCND_ALERT_WEBHOOK_URL:  ${{ secrets.ASCND_ALERT_WEBHOOK_URL }}
          ALERT_MANAGER_ID:         ${{ github.event.inputs.manager_id || '' }}
          ALERT_MANAGER_NAME:       ${{ github.event.inputs.manager_name || '' }}
          ALERT_OVERRIDE_EMAIL:     ${{ github.event.inputs.override_email || '' }}
          ALERT_ALL_MANAGERS:       ${{ github.event.inputs.all_managers || 'false' }}
          ALERT_WINDOW_DAYS:        ${{ github.event.inputs.window_days || '' }}
          ALERT_WINDOW_FROM:        ${{ github.event.inputs.window_from || '' }}
          ALERT_WINDOW_TO:          ${{ github.event.inputs.window_to || '' }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run || 'false' }}
          DASHBOARD_URL:            ${{ vars.DASHBOARD_URL }}
        run: node scripts/alert.js
