name: Submit Gemini Batch

on:
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC (3hrs after the 00:00 sync)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Only submit unprocessed calls newer than N days (0 = all unprocessed). Use 30 for the one-off backfill.'
        default: '0'
      batch_size:
        description: 'Max calls to pull this run (fanned into GEMINI_CHUNK-sized jobs). Raise for backfill.'
        default: '1000'
      dry_run:
        description: 'true = build + log the batch without submitting'
        default: 'false'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Submit Gemini batch jobs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL:             'gemini-3.6-flash'
          BATCH_ACTION:         'submit'
          BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days || '0' }}
          BATCH_SIZE:           ${{ github.event.inputs.batch_size || '1000' }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/process.js
