name: Submit Gemini Batch

on:
  # Submit as soon as the daily sync finishes (new calls only arrive with it). The fixed
  # "03:00" schedule used to start ~10:30 UTC, 6h after the sync had landed.
  workflow_run:
    workflows: ['Sync Canoe Calls']
    types: [completed]
  schedule:
    # Catch-up runs, off the top of the hour: 3 spaced runs/day = up to 3000 calls, but only
    # ~1000 ever enqueued at once (ingest drains each batch before the next submit fires) so
    # we stay under the AI Studio batch ceiling. Collapse to one run + a larger BATCH_SIZE
    # once the expanded quota lands.
    - cron: '41 9 * * *'
    - cron: '41 17 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Only submit unprocessed calls newer than N days (0 = all unprocessed, reaches back into old history). Default 30 keeps the nightly run current. Raise (e.g. 60) or set 0 for a deliberate bulk backfill.'
        default: '30'
      batch_size:
        description: 'Max calls to pull this run (fanned into GEMINI_CHUNK-sized jobs). Raise for backfill.'
        default: '1000'
      dry_run:
        description: 'true = build + log the batch without submitting'
        default: 'false'

# One submit at a time: overlapping runs could both pass the in-flight check and pay twice.
concurrency:
  group: gemini-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Submit Gemini batch jobs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL:             'gemini-3.6-flash'
          BATCH_ACTION:         'submit'
          BACKFILL_DAYS:        ${{ github.event.inputs.backfill_days || '30' }}
          BATCH_SIZE:           ${{ github.event.inputs.batch_size || '1000' }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/process.js
