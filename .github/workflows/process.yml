name: Process Call Transcripts

on:
  # No schedule: nightly production scoring now runs via the Gemini Batch API
  # (process-submit.yml + process-ingest.yml). This workflow stays for manual
  # dispatch + the model-testing / A-B UI in index.html.
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'Model id. Namespaced (e.g. anthropic/claude-sonnet-4-6) routes via OpenRouter; bare id uses Anthropic.'
        default: 'anthropic/claude-sonnet-4-6'
      ai_mode:
        description: 'combined or separate'
        default: 'combined'
      batch_size:
        description: 'Number of calls to process'
        default: '100'
      prompt_id:
        description: 'AI prompt UUID to use (leave blank for active prompt)'
        default: ''
      test_mode:
        description: 'Write results to model_test_results instead of canoe_calls'
        default: 'false'
      test_batch_id:
        description: 'UUID of the model_tests row to write results into'
        default: ''
      batch_mode:
        description: 'true to use Anthropic batch API (50% off, Claude models only)'
        default: 'false'
      test_call_ids:
        description: 'Comma-separated call ids to score. Pins a fixed set (overrides batch_size sampling) so every model scores the identical calls.'
        default: ''

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run AI processing
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL:              ${{ github.event.inputs.ai_model || 'anthropic/claude-sonnet-4-6' }}
          AI_MODE:               ${{ github.event.inputs.ai_mode || 'combined' }}
          BATCH_SIZE:            ${{ github.event.inputs.batch_size || '100' }}
          PROMPT_ID:             ${{ github.event.inputs.prompt_id || '' }}
          TEST_MODE:             ${{ github.event.inputs.test_mode || 'false' }}
          TEST_BATCH_ID:         ${{ github.event.inputs.test_batch_id || '' }}
          BATCH_MODE:            ${{ github.event.inputs.batch_mode || 'false' }}
          TEST_CALL_IDS:         ${{ github.event.inputs.test_call_ids || '' }}
        run: node scripts/process.js
