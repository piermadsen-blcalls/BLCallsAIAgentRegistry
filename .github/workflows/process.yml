name: Process Call Transcripts

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # Mon, Wed, Fri at 8am UTC (2hrs after sync)
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'Claude model to use'
        default: 'claude-sonnet-4-6'
      ai_mode:
        description: 'combined or separate'
        default: 'combined'
      batch_size:
        description: 'Number of calls to process'
        default: '100'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run AI processing
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL:              ${{ github.event.inputs.ai_model || 'claude-sonnet-4-6' }}
          AI_MODE:               ${{ github.event.inputs.ai_mode || 'combined' }}
          BATCH_SIZE:            ${{ github.event.inputs.batch_size || '100' }}
        run: node scripts/process.js
