name: Process Call Transcripts

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # Mon, Wed, Fri at 8am UTC (2hrs after sync)
  workflow_dispatch:
    inputs:
      ai_model:
        description: 'Claude model to use'
        default: 'claude-sonnet-4-6'
      ai_mode:
        description: 'combined or separate'
        default: 'combined'
      batch_size:
        description: 'Number of calls to process'
        default: '100'
      prompt_id:
        description: 'AI prompt UUID to use (leave blank for active prompt)'
        default: ''
      test_mode:
        description: 'Write results to model_test_results instead of canoe_calls'
        default: 'false'
      test_batch_id:
        description: 'UUID of the model_tests row to write results into'
        default: ''

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run AI processing
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL:              ${{ github.event.inputs.ai_model || 'claude-sonnet-4-6' }}
          AI_MODE:               ${{ github.event.inputs.ai_mode || 'combined' }}
          BATCH_SIZE:            ${{ github.event.inputs.batch_size || '100' }}
          PROMPT_ID:             ${{ github.event.inputs.prompt_id || '' }}
          TEST_MODE:             ${{ github.event.inputs.test_mode || 'false' }}
          TEST_BATCH_ID:         ${{ github.event.inputs.test_batch_id || '' }}
        run: node scripts/process.js
